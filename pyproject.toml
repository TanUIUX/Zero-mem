[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeromem-reference"
version = "0.1.0"
description = "Paper-inspired zero-token memory operations for LLM agents"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "networkx>=3.2",
  "qdrant-client>=1.12",
  "pydantic>=2.7",
  "python-dateutil>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
bge = ["FlagEmbedding>=1.3.0", "torch>=2.2"]
spacy = ["spacy>=3.8"]
dev = ["pytest>=8.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
